<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trouville Stats Tracker</title>

  <!-- Meta tags PWA -->
  <meta name="theme-color" content="#D22D27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trouville Stats">

  <!-- Manifesto e Ícone -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23D22D27'/%3E%3Ccircle cx='256' cy='256' r='165' fill='%23DD5748' stroke='%23ffffff' stroke-width='20'/%3E%3Cpath d='M91 256h330M256 91v330M140 140c65 65 65 167 0 232M372 140c-65 65-65 167 0 232' fill='none' stroke='%23ffffff' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23D22D27'/%3E%3Ccircle cx='256' cy='256' r='165' fill='%23DD5748' stroke='%23ffffff' stroke-width='20'/%3E%3Cpath d='M91 256h330M256 91v330M140 140c65 65 65 167 0 232M372 140c-65 65-65 167 0 232' fill='none' stroke='%23ffffff' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    :root {
      --flag-red: #D22D27;
      --rosy-copper: #DD5748;
      --blushed-brick: #BB4A46;
      --dusty-rose: #B97D80;
      --light-coral: #EA948E;
      --bg: #faf6f6;
      --card-bg: #ffffff;
      --text: #2c1e1e;
      --whatsapp: #25D366;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px 12px 28px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 4px 2px;
    }

    h1 {
      color: var(--flag-red);
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-install {
      display: none;
      background-color: var(--flag-red);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(210, 45, 39, 0.3);
    }

    .btn-reset {
      background-color: transparent;
      color: var(--dusty-rose);
      border: 1px solid var(--dusty-rose);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset:active {
      background-color: var(--dusty-rose);
      color: #ffffff;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(187, 74, 70, 0.08);
      border: 1px solid rgba(234, 148, 142, 0.35);
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: var(--blushed-brick);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e4cece;
      border-radius: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--rosy-copper);
    }

    select:last-child {
      margin-bottom: 0;
    }

    .time-checkboxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .time-checkbox-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px;
      border: 1.5px solid #e4cece;
      background: #fdfafa;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--dusty-rose);
      user-select: none;
      margin-bottom: 0;
      transition: all 0.15s ease;
    }

    .time-checkbox-btn input {
      width: auto;
      margin: 0;
      accent-color: var(--flag-red);
    }

    .time-checkbox-btn.checked {
      background: rgba(234, 148, 142, 0.22);
      border-color: var(--rosy-copper);
      color: var(--flag-red);
    }

    .quarter-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .quarter-btn {
      flex: 1;
      padding: 10px 6px;
      border: 1.5px solid #e4cece;
      background: #fdfafa;
      color: var(--blushed-brick);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .quarter-btn.active {
      background: var(--flag-red);
      color: #ffffff;
      border-color: var(--flag-red);
      box-shadow: 0 2px 6px rgba(210, 45, 39, 0.28);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #f5ebeb;
    }

    .stat-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .stat-label {
      font-weight: 600;
      font-size: 0.98rem;
    }

    .stat-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      width: 30px;
      text-align: center;
      color: var(--text);
    }

    .btn-counter {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease, background-color 0.15s;
    }

    .btn-counter:active {
      transform: scale(0.92);
    }

    .btn-add {
      background-color: var(--rosy-copper);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(221, 87, 72, 0.3);
    }

    .btn-sub {
      background-color: rgba(185, 125, 128, 0.2);
      color: var(--blushed-brick);
    }

    .btn-whatsapp {
      width: 100%;
      background-color: var(--whatsapp);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:active {
      transform: scale(0.98);
    }

    .preview {
      background: #f3faf5;
      border-left: 4px solid var(--whatsapp);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      font-size: 0.88rem;
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      color: #1f2d24;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <h1>🏀 Trouville Stats</h1>
    <div class="header-actions">
      <button id="btn-install" class="btn-install" onclick="installPWA()">📲 Instalar</button>
      <button class="btn-reset" onclick="resetMatch()">Zerar</button>
    </div>
  </header>

  <!-- Configuração da Partida -->
  <div class="card">
    <label for="opponent">Adversário:</label>
    <input type="text" id="opponent" placeholder="Ex: Capitol" oninput="handleInputChange()">

    <label for="location">Mando de Jogo:</label>
    <select id="location" onchange="handleInputChange()">
      <option value="home">Casa (Trouville x Adversário)</option>
      <option value="away">Fora (Adversário x Trouville)</option>
    </select>
  </div>

  <!-- Seleção dos Tempos Jogados -->
  <div class="card">
    <label>Quais tempos ele jogou? (7 min cada)</label>
    <div class="time-checkboxes">
      <label class="time-checkbox-btn checked" id="lbl-t1">
        <input type="checkbox" id="chk-1" checked onchange="toggleQuarterPlayed(1)"> Tempo 1
      </label>
      <label class="time-checkbox-btn checked" id="lbl-t2">
        <input type="checkbox" id="chk-2" checked onchange="toggleQuarterPlayed(2)"> Tempo 2
      </label>
      <label class="time-checkbox-btn checked" id="lbl-t3">
        <input type="checkbox" id="chk-3" checked onchange="toggleQuarterPlayed(3)"> Tempo 3
      </label>
      <label class="time-checkbox-btn" id="lbl-t4">
        <input type="checkbox" id="chk-4" onchange="toggleQuarterPlayed(4)"> Tempo 4
      </label>
      <label class="time-checkbox-btn" id="lbl-t5">
        <input type="checkbox" id="chk-5" onchange="toggleQuarterPlayed(5)"> Tempo 5
      </label>
      <label class="time-checkbox-btn" id="lbl-t6">
        <input type="checkbox" id="chk-6" onchange="toggleQuarterPlayed(6)"> Tempo 6
      </label>
    </div>
  </div>

  <!-- Seleção do Tempo Ativo para Edição -->
  <div class="card" id="card-tab-selector">
    <label>Preencher estatísticas do tempo:</label>
    <div class="quarter-selector" id="quarter-tabs"></div>
  </div>

  <!-- Painel de Contador -->
  <div class="card" id="card-stats-panel">
    <h3 id="current-quarter-title" style="margin-top:0; margin-bottom: 8px; color: var(--flag-red); font-size: 1.05rem;">Estatísticas - Jogo 1</h3>
    
    <div id="stats-controls-body">
      <div class="stat-row">
        <span class="stat-label">Pontos (pts)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" onclick="changeStat('pts', -1)">-</button>
          <span class="stat-value" id="pts-val">0</span>
          <button class="btn-counter btn-add" onclick="changeStat('pts', 1)">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Rebotes (Rb)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" onclick="changeStat('rb', -1)">-</button>
          <span class="stat-value" id="rb-val">0</span>
          <button class="btn-counter btn-add" onclick="changeStat('rb', 1)">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Assistências (ass)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" onclick="changeStat('ass', -1)">-</button>
          <span class="stat-value" id="ass-val">0</span>
          <button class="btn-counter btn-add" onclick="changeStat('ass', 1)">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Roubos (roubos)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" onclick="changeStat('roubos', -1)">-</button>
          <span class="stat-value" id="roubos-val">0</span>
          <button class="btn-counter btn-add" onclick="changeStat('roubos', 1)">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Tocos (tocos)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" onclick="changeStat('tocos', -1)">-</button>
          <span class="stat-value" id="tocos-val">0</span>
          <button class="btn-counter btn-add" onclick="changeStat('tocos', 1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Gerador de Texto e Cópia -->
  <div class="card">
    <button class="btn-whatsapp" onclick="copyToClipboard()">Copiar para WhatsApp</button>
    <div class="preview" id="preview-text"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'trouville_stats_v1';

  const getDefaultState = () => ({
    opponent: '',
    location: 'home',
    playedQuarters: { 1: true, 2: true, 3: true, 4: false, 5: false, 6: false },
    currentActiveQuarter: 1,
    stats: {
      1: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 },
      2: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 },
      3: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 },
      4: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 },
      5: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 },
      6: { pts: 0, rb: 0, ass: 0, roubos: 0, tocos: 0 }
    }
  });

  let state = loadState();

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return { ...getDefaultState(), ...JSON.parse(saved) };
      }
    } catch (e) {
      console.warn('Erro ao ler localStorage:', e);
    }
    return getDefaultState();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Erro ao salvar no localStorage:', e);
    }
  }

  function syncUIWithState() {
    document.getElementById('opponent').value = state.opponent;
    document.getElementById('location').value = state.location;

    for (let q = 1; q <= 6; q++) {
      const chk = document.getElementById(`chk-${q}`);
      const lbl = document.getElementById(`lbl-t${q}`);
      const isChecked = !!state.playedQuarters[q];
      chk.checked = isChecked;
      if (isChecked) lbl.classList.add('checked');
      else lbl.classList.remove('checked');
    }

    renderTabs();
    renderCurrentQuarterStats();
    updatePreview();
  }

  function handleInputChange() {
    state.opponent = document.getElementById('opponent').value;
    state.location = document.getElementById('location').value;
    saveState();
    updatePreview();
  }

  function toggleQuarterPlayed(q) {
    const isChecked = document.getElementById(`chk-${q}`).checked;
    state.playedQuarters[q] = isChecked;

    const lbl = document.getElementById(`lbl-t${q}`);
    if (isChecked) lbl.classList.add('checked');
    else lbl.classList.remove('checked');

    if (!isChecked && state.currentActiveQuarter === q) {
      const activeKeys = Object.keys(state.playedQuarters).filter(k => state.playedQuarters[k]);
      if (activeKeys.length > 0) {
        state.currentActiveQuarter = parseInt(activeKeys[0], 10);
      }
    } else if (isChecked) {
      const activeKeys = Object.keys(state.playedQuarters).filter(k => state.playedQuarters[k]);
      if (activeKeys.length === 1) {
        state.currentActiveQuarter = q;
      }
    }

    saveState();
    renderTabs();
    renderCurrentQuarterStats();
    updatePreview();
  }

  function renderTabs() {
    const container = document.getElementById('quarter-tabs');
    container.innerHTML = '';

    const activeQuarters = Object.keys(state.playedQuarters).filter(q => state.playedQuarters[q]);

    if (activeQuarters.length === 0) {
      document.getElementById('card-tab-selector').style.display = 'none';
      document.getElementById('card-stats-panel').style.display = 'none';
      return;
    }

    document.getElementById('card-tab-selector').style.display = 'block';
    document.getElementById('card-stats-panel').style.display = 'block';

    activeQuarters.forEach((qStr) => {
      const q = parseInt(qStr, 10);
      const btn = document.createElement('button');
      btn.className = `quarter-btn ${q === state.currentActiveQuarter ? 'active' : ''}`;
      btn.innerText = `Jogo ${q}`;
      btn.onclick = () => setQuarter(q);
      container.appendChild(btn);
    });
  }

  function setQuarter(q) {
    state.currentActiveQuarter = q;
    saveState();
    renderTabs();
    renderCurrentQuarterStats();
  }

  function changeStat(statKey, delta) {
    const q = state.currentActiveQuarter;
    if (state.stats[q][statKey] + delta >= 0) {
      state.stats[q][statKey] += delta;
      saveState();
      renderCurrentQuarterStats();
      updatePreview();
    }
  }

  function renderCurrentQuarterStats() {
    const q = state.currentActiveQuarter;
    document.getElementById('current-quarter-title').innerText = `Estatísticas - Jogo ${q}`;
    const qData = state.stats[q];
    if (qData) {
      document.getElementById('pts-val').innerText = qData.pts;
      document.getElementById('rb-val').innerText = qData.rb;
      document.getElementById('ass-val').innerText = qData.ass;
      document.getElementById('roubos-val').innerText = qData.roubos;
      document.getElementById('tocos-val').innerText = qData.tocos;
    }
  }

  function generateText() {
    const opponent = state.opponent.trim() || 'Adversário';
    const isHome = state.location === 'home';

    let header = isHome ? `Trouville x  ${opponent}` : `${opponent} x  Trouville`;
    let text = `${header}\n`;

    const activeQuarters = Object.keys(state.playedQuarters).filter(q => state.playedQuarters[q]);

    if (activeQuarters.length === 0) {
      return `${header}\n(Nenhum tempo jogado selecionado)`;
    }

    activeQuarters.forEach(q => {
      const data = state.stats[q];
      text += `- Jogo ${q}\n`;
      text += ` ${data.pts} pts, ${data.rb} Rb, ${data.ass} ass, ${data.roubos} roubos, ${data.tocos} tocos\n`;
    });

    return text.trim();
  }

  function updatePreview() {
    document.getElementById('preview-text').innerText = generateText();
  }

  function copyToClipboard() {
    const text = generateText();
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-whatsapp');
      const originalText = btn.innerText;
      btn.innerText = '✅ Copiado para o WhatsApp!';
      setTimeout(() => { btn.innerText = originalText; }, 2000);
    }).catch(() => {
      alert('Não foi possível copiar automaticamente. Selecione o texto abaixo e copie.');
    });
  }

  function resetMatch() {
    if (confirm('Deseja zerar todas as estatísticas para iniciar uma nova partida?')) {
      state = getDefaultState();
      saveState();
      syncUIWithState();
    }
  }

  // --- Lógica de Instalação PWA ---
  let deferredPrompt;
  const installBtn = document.getElementById('btn-install');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });

  async function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      installBtn.style.display = 'none';
    }
    deferredPrompt = null;
  }

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    deferredPrompt = null;
  });

  // --- Registro do Service Worker ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.error('Falha ao registrar Service Worker:', err));
    });
  }

  // Inicializa interface com dados salvos
  syncUIWithState();
</script>

</body>
</html>
