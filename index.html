<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trouville Stats Tracker</title>

  <!-- Meta tags PWA -->
  <meta name="theme-color" content="#D22D27">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trouville Stats">

  <!-- Manifesto e Ícones -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23D22D27'/%3E%3Ccircle cx='256' cy='256' r='165' fill='%23DD5748' stroke='%23ffffff' stroke-width='20'/%3E%3Cpath d='M91 256h330M256 91v330M140 140c65 65 65 167 0 232M372 140c-65 65-65 167 0 232' fill='none' stroke='%23ffffff' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23D22D27'/%3E%3Ccircle cx='256' cy='256' r='165' fill='%23DD5748' stroke='%23ffffff' stroke-width='20'/%3E%3Cpath d='M91 256h330M256 91v330M140 140c65 65 65 167 0 232M372 140c-65 65-65 167 0 232' fill='none' stroke='%23ffffff' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <header class="app-header">
    <h1>🏀 Trouville Stats</h1>
    <div class="header-actions">
      <button id="btn-install" class="btn-install" type="button">📲 Instalar</button>
      <button id="btn-reset" class="btn-reset" type="button">Zerar</button>
    </div>
  </header>

  <!-- Configuração da Partida -->
  <div class="card">
    <label for="opponent">Adversário:</label>
    <input type="text" id="opponent" placeholder="Ex: Capitol">

    <label for="location">Mando de Jogo:</label>
    <select id="location">
      <option value="home">Casa (Trouville x Adversário)</option>
      <option value="away">Fora (Adversário x Trouville)</option>
    </select>
  </div>

  <!-- Seleção dos Tempos Jogados -->
  <div class="card">
    <label>Quais tempos ele jogou? (7 min cada)</label>
    <div class="time-checkboxes">
      <label class="time-checkbox-btn checked" id="lbl-t1">
        <input type="checkbox" id="chk-1" data-quarter="1" checked> Tempo 1
      </label>
      <label class="time-checkbox-btn checked" id="lbl-t2">
        <input type="checkbox" id="chk-2" data-quarter="2" checked> Tempo 2
      </label>
      <label class="time-checkbox-btn checked" id="lbl-t3">
        <input type="checkbox" id="chk-3" data-quarter="3" checked> Tempo 3
      </label>
      <label class="time-checkbox-btn" id="lbl-t4">
        <input type="checkbox" id="chk-4" data-quarter="4"> Tempo 4
      </label>
      <label class="time-checkbox-btn" id="lbl-t5">
        <input type="checkbox" id="chk-5" data-quarter="5"> Tempo 5
      </label>
      <label class="time-checkbox-btn" id="lbl-t6">
        <input type="checkbox" id="chk-6" data-quarter="6"> Tempo 6
      </label>
    </div>
  </div>

  <!-- Seleção do Tempo Ativo para Edição -->
  <div class="card" id="card-tab-selector">
    <label>Preencher estatísticas do tempo:</label>
    <div class="quarter-selector" id="quarter-tabs"></div>
  </div>

  <!-- Painel de Contador -->
  <div class="card" id="card-stats-panel">
    <h3 id="current-quarter-title" class="panel-title">Estatísticas - Jogo 1</h3>
    
    <div id="stats-controls-body">
      <div class="stat-row">
        <span class="stat-label">Pontos (pts)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" type="button" data-stat="pts" data-delta="-1">-</button>
          <span class="stat-value" id="pts-val">0</span>
          <button class="btn-counter btn-add" type="button" data-stat="pts" data-delta="1">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Rebotes (Rb)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" type="button" data-stat="rb" data-delta="-1">-</button>
          <span class="stat-value" id="rb-val">0</span>
          <button class="btn-counter btn-add" type="button" data-stat="rb" data-delta="1">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Assistências (ass)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" type="button" data-stat="ass" data-delta="-1">-</button>
          <span class="stat-value" id="ass-val">0</span>
          <button class="btn-counter btn-add" type="button" data-stat="ass" data-delta="1">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Roubos (roubos)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" type="button" data-stat="roubos" data-delta="-1">-</button>
          <span class="stat-value" id="roubos-val">0</span>
          <button class="btn-counter btn-add" type="button" data-stat="roubos" data-delta="1">+</button>
        </div>
      </div>

      <div class="stat-row">
        <span class="stat-label">Tocos (tocos)</span>
        <div class="stat-controls">
          <button class="btn-counter btn-sub" type="button" data-stat="tocos" data-delta="-1">-</button>
          <span class="stat-value" id="tocos-val">0</span>
          <button class="btn-counter btn-add" type="button" data-stat="tocos" data-delta="1">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Gerador de Texto e Cópia -->
  <div class="card">
    <button id="btn-whatsapp" class="btn-whatsapp" type="button">Copiar para WhatsApp</button>
    <div class="preview" id="preview-text"></div>
  </div>
</div>

<!-- Scripts -->
<script src="app.js"></script>
</body>
</html>
